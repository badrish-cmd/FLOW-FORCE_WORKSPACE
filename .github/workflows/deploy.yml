name: CD - Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: flowforceworkspace.cloud
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Starting deployment..."
            
            # Navigate to the project directory
            cd /var/www/flowforce
            
            # Fetch latest code
            git fetch --all
            git reset --hard origin/main
            
            # Activate virtual environment and install dependencies
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Run database migrations
            python manage.py migrate --noinput
            
            # Collect static files
            python manage.py collectstatic --noinput

            # Configure Nginx for large DWG & PDF uploads (up to 500MB) and allow SAMEORIGIN framing
            echo "Configuring Nginx upload limits, timeouts, and framing headers..."
            sudo bash -c 'printf "client_max_body_size 500M;\nclient_body_timeout 300s;\nproxy_read_timeout 300s;\nproxy_connect_timeout 300s;\nproxy_send_timeout 300s;\n" > /etc/nginx/conf.d/upload_limits.conf'
            sudo sed -i 's/client_max_body_size [^;]*;/client_max_body_size 500M;/g' /etc/nginx/sites-enabled/* 2>/dev/null || true
            sudo sed -i 's/client_max_body_size [^;]*;/client_max_body_size 500M;/g' /etc/nginx/sites-available/* 2>/dev/null || true
            sudo sed -i -E 's/add_header\s+X-Frame-Options\s+[^;]+;/add_header X-Frame-Options "SAMEORIGIN" always;/gI' /etc/nginx/sites-enabled/* 2>/dev/null || true
            sudo sed -i -E 's/add_header\s+X-Frame-Options\s+[^;]+;/add_header X-Frame-Options "SAMEORIGIN" always;/gI' /etc/nginx/sites-available/* 2>/dev/null || true

            echo "Testing and reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            # Restart Services (Gunicorn & Celery)
            echo "Restarting application services..."
            sudo systemctl restart gunicorn
            sudo systemctl restart celery
            sudo systemctl restart celerybeat
            
            echo "Deployment finished successfully!"
