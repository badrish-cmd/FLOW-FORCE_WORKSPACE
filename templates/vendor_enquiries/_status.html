{% if status == "ENQUIRY_SENT" %}<span class="inline-flex items-center gap-1 rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-800"><i class="fas fa-paper-plane text-[10px]"></i>Enquiry Sent</span>
{% elif status == "PENDING_REPLY" %}<span class="inline-flex items-center gap-1 rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-800"><i class="fas fa-hourglass-half text-[10px]"></i>Pending Reply from Vendor</span>
{% elif status == "QUOTE_GOT" %}<span class="inline-flex items-center gap-1 rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-semibold text-emerald-800"><i class="fas fa-check text-[10px]"></i>Quote Got</span>
{% endif %}
