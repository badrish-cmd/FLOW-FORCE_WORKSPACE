<div class="mb-4 flex flex-wrap items-center gap-2 text-sm">
    <a href="{% url 'work_orders:list' %}" class="rounded-lg px-3 py-1.5 font-semibold {% if nav == 'list' %}bg-slate-800 text-white{% else %}border border-slate-200 bg-white text-slate-700 hover:bg-slate-50{% endif %}"><i class="fas fa-list mr-1"></i>Work orders</a>
    <a href="{% url 'work_orders:list' %}?mine=1" class="rounded-lg px-3 py-1.5 font-semibold {% if nav == 'mine' %}bg-slate-800 text-white{% else %}border border-slate-200 bg-white text-slate-700 hover:bg-slate-50{% endif %}"><i class="fas fa-user-check mr-1"></i>My work orders</a>
    {% if wo_can_create %}<a href="{% url 'work_orders:create' %}" class="rounded-lg bg-blue-600 px-3 py-1.5 font-semibold text-white hover:bg-blue-700"><i class="fas fa-plus mr-1"></i>New work order</a>{% endif %}
    {% if wo_is_admin %}<a href="{% url 'work_orders:access' %}" class="rounded-lg px-3 py-1.5 font-semibold {% if nav == 'access' %}bg-slate-800 text-white{% else %}border border-slate-200 bg-white text-slate-700 hover:bg-slate-50{% endif %}"><i class="fas fa-user-shield mr-1"></i>Team Access</a>{% endif %}
</div>
