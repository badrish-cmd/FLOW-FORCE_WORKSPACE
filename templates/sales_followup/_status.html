{% if status == "WAITING" %}<span class="inline-flex items-center rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-semibold text-amber-800">Waiting for update</span>
{% elif status == "FOLLOWED_UP" %}<span class="inline-flex items-center rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-800">Followed up</span>
{% elif status == "REVIEWING" %}<span class="inline-flex items-center rounded-full bg-indigo-100 px-2.5 py-0.5 text-xs font-semibold text-indigo-800">Customer reviewing</span>
{% elif status == "WON" %}<span class="inline-flex items-center rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-semibold text-emerald-800"><i class="fas fa-check mr-1 text-[10px]"></i>PO received / Won</span>
{% elif status == "LOST" %}<span class="inline-flex items-center rounded-full bg-slate-200 px-2.5 py-0.5 text-xs font-semibold text-slate-700">Lost</span>
{% elif status == "CANCELLED" %}<span class="inline-flex items-center rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 line-through">Cancelled (voided)</span>
{% endif %}
