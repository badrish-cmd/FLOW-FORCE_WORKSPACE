<div class="mb-5 flex flex-wrap items-center gap-2 border-b border-slate-200 pb-3 text-sm">
    <a href="{% url 'vendor_quotes:quote_list' %}" class="rounded-lg px-3 py-1.5 font-medium {% if nav == 'quotes' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}"><i class="fas fa-file-invoice-dollar mr-1.5"></i>Quotes</a>
    <a href="{% url 'vendor_quotes:vendor_list' %}" class="rounded-lg px-3 py-1.5 font-medium {% if nav == 'vendors' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}"><i class="fas fa-industry mr-1.5"></i>Vendors &amp; masters</a>
    {% if can_approve or is_admin %}
    <a href="{% url 'vendor_quotes:zoho_settings' %}" class="rounded-lg px-3 py-1.5 font-medium {% if nav == 'zoho' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}"><i class="fas fa-plug mr-1.5"></i>Zoho Books</a>
    <a href="{% url 'vendor_quotes:ai_usage' %}" class="rounded-lg px-3 py-1.5 font-medium {% if nav == 'ai_usage' %}bg-blue-50 text-blue-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}"><i class="fas fa-microchip mr-1.5"></i>AI usage</a>
    {% endif %}
    <a href="{% url 'vendor_quotes:quote_create' %}" class="ml-auto inline-flex items-center gap-2 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white shadow-sm hover:bg-blue-700"><i class="fas fa-plus"></i>New vendor quote</a>
